<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darkroom</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="../" class="back-link" title="Back to menu">←</a>
    <h1>Darkroom</h1>

    <div id="settings">
      <div class="setting-row">
        <label>Grid size:</label>
        <input type="number" id="grid-size" min="3" max="9" value="5">
      </div>
      <div class="setting-buttons">
        <button id="btn-new-game">New Game</button>
      </div>
    </div>

    <div id="stats">
      <span id="move-count">0 moves</span>
    </div>

    <div id="board-container">
      <div id="board" class="board"></div>
    </div>

    <div id="message" class="message"></div>

    <div id="win-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="win-title">Lights out!</h2>
        <p id="win-detail"></p>
        <button id="btn-play-again" class="btn-primary">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
